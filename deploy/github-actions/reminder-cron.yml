name: reminder-cron

# 5 分钟级扫描由外部定时器 cron-job.org 承担（准点，不受 GitHub 调度降频影响）。
# 本工作流降为「每日 1 次兜底」：外部定时器失效时，仍能每天覆盖约 5 小时 48 分。
#
# 背景：GitHub 对 schedule 触发实测严重延迟——即使写死 `0 0,6,12,18 * * *`，
# 2026-09-14/15 实测每次迟到 1.7~5.6 小时（平均 3.6 小时），班次间隔 6 小时而单班只跑
# 5 小时 48 分，一迟到就裂出真实空档（4 段超 1 小时，9/14 全天 7.6 小时无扫描）。
# 重复扫描无副作用：后端提醒去重（同一时间块只推一次）兜底。
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch: {}

jobs:
  run-reminders:
    runs-on: ubuntu-latest
    # 循环设计时长约 348 分钟；355 分钟超时兜底，低于 GitHub 360 分钟硬上限
    timeout-minutes: 355
    steps:
      - name: Trigger reminder scans in a loop
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$BACKEND_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Backend cron secrets not configured; skipping."
            exit 0
          fi
          # 70 轮、轮间 sleep 300 秒；单次失败只记日志不中断（瞬时故障下轮补扫），
          # 持续失败由 Axiom「扫描心跳缺失」监控邮件兜底。
          for i in $(seq 1 70); do
            echo "[reminder-cron] scan $i/70 at $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
            if ! curl -fsS --max-time 60 \
              -H "Authorization: Bearer $CRON_SECRET" \
              "$BACKEND_URL/api/v1/reminders/cron"; then
              echo "[reminder-cron] scan $i request failed (transient, continuing)"
            fi
            if [ "$i" -lt 70 ]; then
              sleep 300
            fi
          done
          echo "[reminder-cron] loop complete"
