name: reminder-cron

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

jobs:
  run-reminders:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger reminder scan
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$BACKEND_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Backend cron secrets not configured; skipping."
            exit 0
          fi
          curl -fsS -H "Authorization: Bearer $CRON_SECRET" "$BACKEND_URL/api/v1/reminders/cron"
